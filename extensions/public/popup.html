<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 220px;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      text-align: center;
    }
    .logo { font-size: 18px; font-weight: bold; color: #6366f1; margin-bottom: 12px; }
    .sub  { font-size: 12px; color: #94a3b8; margin-bottom: 16px; }
    button {
      width: 100%;
      padding: 10px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="logo">📚 Study Planner AI</div>
  <div class="sub">Your AI-powered study assistant</div>
  <button id="openBtn">Open Sidebar</button>
  <script src="popup.js"></script>
</body>
</html>
